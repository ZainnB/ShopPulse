# One-click deploy on Render: web service (Docker) + managed Postgres.
# After the first deploy, set ANTHROPIC_API_KEY in the dashboard to enable live AI;
# without it the AI endpoints fall back to the built-in query library.
services:
  - type: web
    name: shoppulse
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shoppulse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ENABLED
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PORT
        value: "8080"

databases:
  - name: shoppulse-db
    plan: free
    postgresMajorVersion: "16"
