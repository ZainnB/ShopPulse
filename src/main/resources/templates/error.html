<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body data-page="error">
<header th:replace="~{fragments/layout :: nav}"></header>
<main id="main" class="container narrow">
  <section class="card auth-card">
    <h1>Something went wrong</h1>
    <p class="muted">The page you asked for could not be shown. It may have moved, or the server hit a problem.</p>
    <div class="btn-row">
      <a class="btn btn-primary" th:href="@{/}">Back to the shop</a>
      <a class="btn btn-ghost" th:href="@{/login}">Log in</a>
    </div>
  </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script type="module" th:src="@{/js/nav.js}"></script>
</body>
</html>
