<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Shop')}"></head>
<body data-page="storefront">
<header th:replace="~{fragments/layout :: nav}"></header>
<main id="main" class="container">
  <div class="page-head">
    <h1>Shop</h1>
    <p class="muted" id="result-count" aria-live="polite"></p>
  </div>
  <form class="filters card" id="filter-form" role="search">
    <div class="field grow">
      <label for="q">Search products</label>
      <input id="q" type="search" placeholder="Name or keyword">
    </div>
    <div class="field">
      <label for="category">Category</label>
      <select id="category"><option value="">All categories</option></select>
    </div>
    <button type="submit" class="btn btn-primary">Search</button>
  </form>
  <div id="toast" class="alert" role="status" aria-live="polite" hidden></div>
  <div id="product-grid" class="product-grid" aria-live="polite" aria-busy="true">
    <p class="muted">Loading products...</p>
  </div>
  <nav class="pager" id="pager" aria-label="Pagination"></nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script type="module" th:src="@{/js/storefront.js}"></script>
</body>
</html>
