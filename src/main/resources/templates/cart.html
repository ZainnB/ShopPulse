<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cart')}"></head>
<body data-page="cart">
<header th:replace="~{fragments/layout :: nav}"></header>
<main id="main" class="container">
  <div class="page-head"><h1>Your cart</h1></div>
  <div id="cart-msg" class="alert" role="alert" aria-live="assertive" hidden></div>
  <section id="cart-root" class="card" aria-live="polite" aria-busy="true">
    <p class="muted">Loading cart...</p>
  </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script type="module" th:src="@{/js/cart.js}"></script>
</body>
</html>
