services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shoppulse
      POSTGRES_USER: shoppulse
      POSTGRES_PASSWORD: shoppulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoppulse -d shoppulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/shoppulse
      DATABASE_USER: shoppulse
      DATABASE_PASSWORD: shoppulse
      # All optional. With no key at all the AI features answer from the built-in
      # query library and label themselves "rule-based". Set ANTHROPIC_API_KEY, or
      # point the OpenAI-compatible client at a free tier (see docs/DEPLOYMENT.md).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-not-set}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-set}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SEED_ENABLED: "true"
    ports:
      - "8080:8080"

volumes:
  pgdata:
