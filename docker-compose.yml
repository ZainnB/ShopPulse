services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shoppulse
      POSTGRES_USER: shoppulse
      POSTGRES_PASSWORD: shoppulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoppulse -d shoppulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/shoppulse
      DATABASE_USER: shoppulse
      DATABASE_PASSWORD: shoppulse
      # Optional: without a key the AI features fall back to deterministic answers.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-not-set}
      SEED_ENABLED: "true"
    ports:
      - "8080:8080"

volumes:
  pgdata:
